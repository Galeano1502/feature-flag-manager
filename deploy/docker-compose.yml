services:
  redis:
    image: redis:7-alpine
    container_name: ff_redis
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15-alpine
    container_name: ff_postgres
    environment:
      POSTGRES_DB: feature_flags
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: